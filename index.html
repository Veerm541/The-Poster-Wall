<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#FCA847">

    <title>poster wall — pin something</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>

    <style>
        :root {
            --cream: #FDF6E9;
            --paper: #FFFFFF;
            --ink: #171310;
            --ink-dim: #7a7267;

            --amber: #FCA847;
            --leaf: #3FA66B;
            --rose: #E5484D;

            --sans: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
            --mono: ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace;

            box-sizing: border-box;

            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            box-sizing: inherit;
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px);
        }

        body {
            margin: 0;
            background: var(--cream);
            color: var(--ink);
            font-family: var(--sans);
            min-height: 100%;
        }

        /* =========================
       TOP BAR
    ========================= */

        .top {
            position: sticky;
            top: 0;
            top: env(safe-area-inset-top, 0px);

            background: var(--cream);
            border-bottom: 3px solid var(--ink);

            padding: clamp(10px, 3vw, 14px) clamp(14px, 4vw, 20px);

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 10px;
            flex-wrap: wrap;

            z-index: 5;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;

            font-weight: 700;
            font-size: clamp(0.92rem, 0.8rem + 1vw, 1.05rem);
        }

        .pill {
            font-family: var(--mono);
            font-size: clamp(0.68rem, 0.6rem + 0.5vw, 0.75rem);
            font-weight: 600;

            border: 2px solid var(--ink);
            background: var(--paper);

            border-radius: 20px;
            padding: 5px 10px;

            display: flex;
            align-items: center;
            gap: 6px;

            white-space: nowrap;
        }

        .pill .lv {
            width: 7px;
            height: 7px;

            border-radius: 50%;
            background: var(--leaf);

            box-shadow: 0 0 5px var(--leaf);

            flex-shrink: 0;
        }

        .pill.off .lv {
            background: var(--ink-dim);
            box-shadow: none;
        }

        .shuffleBtn {
            font-family: var(--mono);
            font-size: clamp(0.68rem, 0.6rem + 0.5vw, 0.75rem);
            font-weight: 600;

            cursor: pointer;

            border: 2px solid var(--ink);
            background: var(--paper);

            border-radius: 20px;
            padding: 5px 10px;

            white-space: nowrap;
        }

        .shuffleBtn:active {
            transform: translate(1px, 1px);
        }

        /* =========================
       HERO
    ========================= */

        .hero {
            max-width: 680px;

            margin: clamp(26px, 6vw, 40px) auto 6px;

            padding: 0 clamp(14px, 4vw, 20px);

            text-align: center;
        }

        .hero h1 {
            font-size: clamp(1.4rem, 1rem + 3.5vw, 2.1rem);

            margin: 0;

            letter-spacing: -0.01em;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: clamp(6px, 2vw, 10px);

            flex-wrap: wrap;
        }

        .hero .spark {
            width: clamp(16px, 4vw, 22px);
            height: clamp(16px, 4vw, 22px);

            flex-shrink: 0;
        }

        .hero p {
            color: var(--ink-dim);

            font-size: clamp(0.82rem, 0.78rem + 0.4vw, 0.95rem);

            margin: 10px 0 0;
        }

        /* =========================
       COMPOSE FORM
    ========================= */

        .compose {
            max-width: 560px;

            margin: 26px auto 8px;

            padding: 0 clamp(14px, 4vw, 20px);
        }

        .panel {
            background: var(--paper);

            border: 3px solid var(--ink);
            box-shadow: 6px 6px 0 var(--ink);

            border-radius: 10px;

            padding: clamp(14px, 4vw, 18px);
        }

        .field {
            margin-bottom: 12px;
        }

        .field label {
            font-family: var(--mono);
            font-size: 0.72rem;

            color: var(--ink-dim);

            display: block;

            margin-bottom: 5px;
        }

        .field input,
        .field textarea {
            width: 100%;

            border: 2px solid var(--ink);
            border-radius: 6px;

            background: var(--cream);

            color: var(--ink);
            caret-color: var(--ink);

            -webkit-text-fill-color: var(--ink);

            color-scheme: light;

            font-family: var(--sans);
            font-size: 0.95rem;

            padding: 9px 10px;

            outline: none;

            resize: none;
        }

        .field input::placeholder,
        .field textarea::placeholder {
            color: var(--ink-dim);
            -webkit-text-fill-color: var(--ink-dim);

            opacity: 1;
        }

        .field textarea {
            min-height: 66px;
            line-height: 1.4;
        }

        .field input:focus,
        .field textarea:focus {
            background: var(--paper);

            box-shadow: 0 0 0 2px var(--amber);
        }

        /* =========================
       ACTION BUTTONS
    ========================= */

        .actionGroup {
            position: relative;

            display: flex;
            align-items: center;

            gap: 8px;
        }

        .emojiBtn {
            border: 2px solid var(--ink);

            background: var(--paper);

            border-radius: 6px;

            font-size: 0.95rem;
            line-height: 1;

            padding: 6px 8px;

            cursor: pointer;
        }

        .emojiBtn:active {
            transform: translate(1px, 1px);
        }

        /* =========================
       EMOJI PICKER
       FIXED ALIGNMENT + SPACING
    ========================= */

        .emojiPicker {
            position: absolute;

            bottom: calc(100% + 10px);

            /* Align picker to the right side
         so it doesn't overflow the panel */
            right: 0;
            left: auto;

            z-index: 10;

            width: 220px;

            background: var(--paper);

            border: 2px solid var(--ink);
            border-radius: 8px;

            box-shadow: 4px 4px 0 var(--ink);

            /* Space between emojis and outer border */
            padding: 10px;

            display: grid;

            grid-template-columns: repeat(6, 1fr);

            /* Space between individual emojis */
            gap: 4px;
        }

        .emojiPicker[hidden] {
            display: none;
        }

        .emojiPicker button {
            border: none;

            background: transparent;

            font-size: 1.2rem;

            /* Individual emoji spacing */
            padding: 5px;

            cursor: pointer;

            border-radius: 4px;

            display: flex;
            align-items: center;
            justify-content: center;

            min-width: 0;
        }

        .emojiPicker button:hover {
            background: var(--cream);
        }

        /* =========================
       GIF POPOVER
    ========================= */

        .gifPopover {
            position: absolute;

            bottom: calc(100% + 8px);

            left: 0;

            z-index: 10;

            width: 260px;

            background: var(--paper);

            border: 2px solid var(--ink);
            border-radius: 8px;

            box-shadow: 4px 4px 0 var(--ink);

            padding: 8px;
        }

        .gifPopover[hidden] {
            display: none;
        }

        .gifSearchRow {
            display: flex;
            gap: 6px;
        }

        .gifPopover input {
            flex: 1;

            min-width: 0;

            border: 2px solid var(--ink);
            border-radius: 5px;

            background: var(--cream);

            color: var(--ink);

            font-family: var(--mono);
            font-size: 0.75rem;

            padding: 5px 6px;

            outline: none;
        }

        .gifPopover button {
            border: 2px solid var(--ink);

            background: var(--leaf);
            color: var(--ink);

            border-radius: 5px;

            font-family: var(--mono);
            font-size: 0.72rem;
            font-weight: 700;

            padding: 0 8px;

            cursor: pointer;

            flex-shrink: 0;
        }

        .gifResults {
            margin-top: 8px;

            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 5px;

            max-height: 170px;

            overflow-y: auto;
        }

        .gifResults .gifThumb {
            border: 2px solid var(--ink);
            border-radius: 5px;

            padding: 0;

            cursor: pointer;

            overflow: hidden;

            background: var(--cream);
        }

        .gifResults .gifThumb img {
            width: 100%;
            height: 52px;

            object-fit: cover;

            display: block;
        }

        .gifResults .gifMsg {
            grid-column: 1 / -1;

            font-family: var(--mono);
            font-size: 0.7rem;

            color: var(--ink-dim);

            padding: 6px 2px;
        }

        .gifChip {
            display: flex;
            align-items: center;

            gap: 8px;

            margin-top: 4px;
        }

        .gifChip[hidden] {
            display: none;
        }

        .gifChip img {
            height: 48px;

            border: 2px solid var(--ink);

            border-radius: 6px;

            display: block;
        }

        .gifChip button {
            border: 2px solid var(--ink);

            background: var(--rose);
            color: #fff;

            border-radius: 50%;

            width: 22px;
            height: 22px;

            font-size: 0.7rem;
            line-height: 1;

            cursor: pointer;
        }

        /* =========================
       PANEL FOOTER
    ========================= */

        .panelFoot {
            display: flex;

            justify-content: space-between;
            align-items: center;

            margin-top: 10px;
        }

        .count {
            font-family: var(--mono);
            font-size: 0.72rem;

            color: var(--ink-dim);
        }

        .count.warn {
            color: var(--rose);
        }

        button.pinbtn {
            background: var(--amber);
            color: var(--ink);

            border: 3px solid var(--ink);
            border-radius: 8px;

            font-family: var(--sans);
            font-weight: 700;
            font-size: 0.9rem;

            min-height: 44px;

            padding: 9px 18px;

            cursor: pointer;

            box-shadow: 4px 4px 0 var(--ink);

            transition:
                transform 90ms ease,
                box-shadow 90ms ease;
        }

        button.pinbtn:active {
            transform: translate(4px, 4px);

            box-shadow: 0 0 0 var(--ink);
        }

        button.pinbtn:disabled {
            opacity: 0.5;

            cursor: default;

            transform: none;

            box-shadow: 4px 4px 0 var(--ink);
        }

        .err {
            color: var(--rose);

            font-family: var(--mono);
            font-size: 0.78rem;

            margin-top: 8px;
        }

        /* =========================
       BOARD
    ========================= */

        .board {
            max-width: 1100px;

            margin: 30px auto 60px;

            padding: 10px clamp(14px, 4vw, 20px) 20px;
        }

        .wall {
            display: grid;

            grid-template-columns:
                repeat(auto-fill, minmax(min(190px, 100%), 1fr));

            gap: clamp(14px, 3vw, 22px);
        }

        .note {
            position: relative;

            background: var(--paper);

            border: 3px solid var(--ink);
            border-radius: 8px;

            padding: 16px 14px 12px;

            min-height: 130px;

            box-shadow: 5px 5px 0 var(--ink);

            transition:
                transform 140ms ease,
                box-shadow 140ms ease;
        }

        .note:hover {
            transform: translate(-3px, -3px);

            box-shadow: 8px 8px 0 var(--ink);
        }

        .note .tab {
            position: absolute;

            top: -3px;
            left: 16px;

            width: 26px;
            height: 8px;

            border-radius: 0 0 4px 4px;

            border: 3px solid var(--ink);
            border-top: none;
        }

        .note .msg {
            font-size: 0.98rem;

            line-height: 1.4;

            word-break: break-word;

            margin-top: 6px;
        }

        .note .noteGif {
            width: 100%;

            border-radius: 4px;

            display: block;

            margin-top: 6px;
        }

        .note .meta {
            font-family: var(--mono);
            font-size: 0.68rem;

            color: var(--ink-dim);

            margin-top: 12px;

            display: flex;

            justify-content: space-between;

            border-top: 1px solid #e5ddc9;

            padding-top: 8px;
        }

        .empty {
            grid-column: 1 / -1;

            text-align: center;

            color: var(--ink-dim);

            font-size: 0.9rem;

            padding: 60px 10px;

            font-family: var(--mono);
        }

        .foot-note {
            max-width: 560px;

            margin: 0 auto 50px;

            padding: 0 20px;

            color: var(--ink-dim);

            font-size: 0.76rem;
            line-height: 1.5;

            text-align: center;
        }

        /* =========================
       PIN ANIMATION
    ========================= */

        @keyframes pop {
            0% {
                transform:
                    translate(-50%, -50%) scale(0) rotate(0deg);

                opacity: 1;
            }

            100% {
                transform:
                    translate(-50%, -50%) scale(1) translateY(-40px) rotate(25deg);

                opacity: 0;
            }
        }

        .spk {
            position: absolute;

            left: 50%;
            top: 50%;

            font-size: 1.1rem;

            pointer-events: none;

            animation: pop 650ms ease-out forwards;
        }

        /* =========================
       MOBILE
    ========================= */

        @media (max-width: 520px) {
            .emojiPicker {
                width: 210px;

                padding: 8px;

                gap: 3px;
            }

            .emojiPicker button {
                font-size: 1.15rem;
                padding: 4px;
            }

            .gifPopover {
                right: 0;
                left: auto;

                width: min(260px, calc(100vw - 40px));
            }
        }
    </style>
</head>

<body>

    <!-- =========================
       HEADER
  ========================== -->

    <div class="top">

        <div class="brand">
            📌 poster wall
        </div>

        <div style="
        display:flex;
        gap:8px;
        align-items:center;
      ">
            <button class="shuffleBtn" id="shuffleBtn" type="button">
                shuffle
            </button>

            <div class="pill off" id="statusPill">
                <span class="lv"></span>

                <span id="statusText">
                    …
                </span>
            </div>
        </div>

    </div>

    <!-- =========================
       HERO
  ========================== -->

    <div class="hero">

        <h1>

            <svg class="spark" viewBox="0 0 24 24" fill="none">
                <path d="M12 2l2 7 7 2-7 2-2 7-2-7-7-2 7-2 2-7z" fill="#E5484D" />
            </svg>

            the poster wall

            <svg class="spark" viewBox="0 0 24 24" fill="none">
                <path d="M12 2l2 7 7 2-7 2-2 7-2-7-7-2 7-2 2-7z" fill="#3FA66B" />
            </svg>

        </h1>

        <p>
            Pin a note. Anyone with this board open sees it land, live.
        </p>

    </div>

    <!-- =========================
       COMPOSER
  ========================== -->

    <div class="compose">

        <form class="panel" id="composeForm">

            <div class="field">

                <label for="nameInput">
                    from
                </label>

                <input id="nameInput" type="text" maxlength="24" placeholder="anonymous">

            </div>

            <div class="field">

                <label for="msgInput">
                    message · under 220 characters
                </label>

                <textarea id="msgInput" maxlength="220" placeholder="say something to the wall…"></textarea>

            </div>

            <!-- Selected GIF preview -->

            <div class="gifChip" id="gifChip" hidden>

                <img id="gifChipImg" alt="attached gif">

                <button type="button" id="gifRemove" aria-label="Remove gif">
                    ✕
                </button>

            </div>

            <div class="panelFoot">

                <span class="count" id="count">
                    220 left
                </span>

                <div class="actionGroup">

                    <!-- Emoji button -->

                    <button type="button" class="emojiBtn" id="emojiBtn" aria-label="Insert emoji">
                        😊
                    </button>

                    <!-- Emoji picker -->

                    <div class="emojiPicker" id="emojiPicker" hidden></div>

                    <!-- GIF button -->

                    <button type="button" class="emojiBtn" id="gifBtn" aria-label="Attach a gif">
                        🎞️
                    </button>

                    <!-- GIF popup -->

                    <div class="gifPopover" id="gifPopover" hidden>

                        <div class="gifSearchRow">

                            <input type="text" id="gifQuery" placeholder="paste a .gif link…">

                            <button type="button" id="gifAttach">
                                attach
                            </button>

                        </div>

                        <div class="gifResults" id="gifResults"></div>

                    </div>

                    <!-- Pin button -->

                    <button class="pinbtn" id="pinBtn" type="submit">
                        Pin it
                    </button>

                </div>

            </div>

            <div class="err" id="errMsg" hidden></div>

        </form>

    </div>

    <!-- =========================
       POST WALL
  ========================== -->

    <div class="board">

        <div class="wall" id="wall">

            <div class="empty">
                the board's empty. pin the first note.
            </div>

        </div>

    </div>

   <div class="foot-note">
  This is a live shared wall. Anything you pin here can be seen by everyone who visits the site.
</div>

    <!-- =========================
       JAVASCRIPT
  ========================== -->

    <script>

        /* =========================
           GENERAL
        ========================= */

        const TABS = [
            'var(--amber)',
            'var(--leaf)',
            'var(--rose)'
        ];

        function hash(str) {

            let h = 0;

            for (let i = 0; i < str.length; i++) {
                h = (h * 31 + str.charCodeAt(i)) | 0;
            }

            return Math.abs(h);
        }

        function timeAgo(ts) {

            const s = Math.max(
                1,
                Math.floor((Date.now() - ts) / 1000)
            );

            if (s < 60) {
                return s + 's ago';
            }

            const m = Math.floor(s / 60);

            if (m < 60) {
                return m + 'm ago';
            }

            const h = Math.floor(m / 60);

            if (h < 24) {
                return h + 'h ago';
            }

            return Math.floor(h / 24) + 'd ago';
        }

        /*
          SUPABASE_URL and SUPABASE_ANON_KEY
          come from config.js.
        */

        let posts = [];

        let shuffled = false;
        let liveMode = false;

        let sb = null;

        /* =========================
           ELEMENTS
        ========================= */

        const wallEl =
            document.getElementById('wall');

        const statusPill =
            document.getElementById('statusPill');

        const statusText =
            document.getElementById('statusText');

        const form =
            document.getElementById('composeForm');

        const nameInput =
            document.getElementById('nameInput');

        const msgInput =
            document.getElementById('msgInput');

        const countEl =
            document.getElementById('count');

        const pinBtn =
            document.getElementById('pinBtn');

        const errMsg =
            document.getElementById('errMsg');

        const shuffleBtn =
            document.getElementById('shuffleBtn');

        const emojiBtn =
            document.getElementById('emojiBtn');

        const emojiPicker =
            document.getElementById('emojiPicker');

        const gifBtn =
            document.getElementById('gifBtn');

        const gifPopover =
            document.getElementById('gifPopover');

        const gifQuery =
            document.getElementById('gifQuery');

        const gifAttach =
            document.getElementById('gifAttach');

        const gifResults =
            document.getElementById('gifResults');

        const gifChip =
            document.getElementById('gifChip');

        const gifChipImg =
            document.getElementById('gifChipImg');

        const gifRemove =
            document.getElementById('gifRemove');

        /* =========================
           GIF
        ========================= */

        let attachedGif = null;
        let gifTimer = null;

        const GIF_SEARCH_ENABLED =
            typeof GIPHY_API_KEY !== 'undefined' &&
            GIPHY_API_KEY &&
            !GIPHY_API_KEY.startsWith('YOUR_');

        if (GIF_SEARCH_ENABLED) {

            gifQuery.placeholder = 'search GIFs…';

            gifAttach.hidden = true;

        } else {

            gifQuery.placeholder =
                'paste a .gif link…';

        }

        async function searchGiphy(q) {

            if (!q) {
                gifResults.innerHTML = '';
                return;
            }

            try {

                const res = await fetch(
                    `https://api.giphy.com/v1/gifs/search?api_key=${encodeURIComponent(
                        GIPHY_API_KEY
                    )}&q=${encodeURIComponent(
                        q
                    )}&limit=12&rating=pg-13`
                );

                const json = await res.json();

                const items = json.data || [];

                gifResults.innerHTML = items.length
                    ? items.map(g => {

                        const thumb = (
                            g.images.fixed_width_small ||
                            g.images.preview_gif ||
                            g.images.original
                        ).url;

                        const full = (
                            g.images.fixed_width ||
                            g.images.original
                        ).url;

                        return `
                <button
                  type="button"
                  class="gifThumb"
                  data-full="${full.replace(/"/g, '&quot;')}"
                >
                  <img
                    src="${thumb.replace(/"/g, '&quot;')}"
                    alt=""
                  >
                </button>
              `;

                    }).join('')

                    : '<div class="gifMsg">no results</div>';

            } catch (e) {

                gifResults.innerHTML =
                    '<div class="gifMsg">search failed — try again</div>';

            }
        }

        if (GIF_SEARCH_ENABLED) {

            gifQuery.addEventListener(
                'input',
                () => {

                    clearTimeout(gifTimer);

                    gifTimer = setTimeout(
                        () => searchGiphy(
                            gifQuery.value.trim()
                        ),
                        400
                    );

                }
            );

            gifResults.addEventListener(
                'click',
                (e) => {

                    const btn =
                        e.target.closest('.gifThumb');

                    if (!btn) {
                        return;
                    }

                    attachedGif =
                        btn.dataset.full;

                    gifChipImg.src =
                        attachedGif;

                    gifChip.hidden =
                        false;

                    gifPopover.hidden =
                        true;

                    gifQuery.value = '';

                    gifResults.innerHTML = '';

                }
            );
        }

        /* =========================
           EMOJIS
        ========================= */

        const EMOJIS = [
            '😀',
            '😂',
            '😍',
            '😎',
            '🥳',
            '😢',
            '😡',
            '👍',
            '👎',
            '❤️',
            '🔥',
            '✨',
            '🎉',
            '🥀',
            '👀',
            '💀',
            '🤔',
            '😴',
            '🙏',
            '💯',
            '😭',
            '😅',
            '🤯',
            '😔'
        ];

        emojiPicker.innerHTML =
            EMOJIS
                .map(
                    e => `<button type="button">${e}</button>`
                )
                .join('');

        /* =========================
           POPOVERS
        ========================= */

        function closePopovers() {

            emojiPicker.hidden = true;

            gifPopover.hidden = true;
        }

        /* Emoji button */

        emojiBtn.addEventListener(
            'click',
            (e) => {

                e.stopPropagation();

                const willOpen =
                    emojiPicker.hidden;

                closePopovers();

                emojiPicker.hidden =
                    !willOpen;

            }
        );

        /* Insert selected emoji */

        emojiPicker.addEventListener(
            'click',
            (e) => {

                if (
                    e.target.tagName !== 'BUTTON'
                ) {
                    return;
                }

                const emoji =
                    e.target.textContent;

                const start =
                    msgInput.selectionStart;

                const end =
                    msgInput.selectionEnd;

                const val =
                    msgInput.value;

                const next =
                    val.slice(0, start) +
                    emoji +
                    val.slice(end);

                if (next.length <= 220) {

                    msgInput.value =
                        next;

                    const pos =
                        start + emoji.length;

                    msgInput.setSelectionRange(
                        pos,
                        pos
                    );

                    msgInput.dispatchEvent(
                        new Event('input')
                    );
                }

                msgInput.focus();

            }
        );

        /* =========================
           GIF BUTTON
        ========================= */

        gifBtn.addEventListener(
            'click',
            (e) => {

                e.stopPropagation();

                const willOpen =
                    gifPopover.hidden;

                closePopovers();

                gifPopover.hidden =
                    !willOpen;

                if (!gifPopover.hidden) {
                    gifQuery.focus();
                }

            }
        );

        gifAttach.addEventListener(
            'click',
            () => {

                const url =
                    gifQuery.value.trim();

                if (!url) {
                    return;
                }

                attachedGif = url;

                gifChipImg.src =
                    url;

                gifChip.hidden =
                    false;

                gifQuery.value = '';

                gifPopover.hidden =
                    true;

            }
        );

        gifRemove.addEventListener(
            'click',
            () => {

                attachedGif = null;

                gifChip.hidden =
                    true;

                gifChipImg.src = '';

            }
        );

        /* Close popovers when clicking outside */

        document.addEventListener(
            'click',
            (e) => {

                if (
                    !emojiPicker.hidden &&
                    !emojiPicker.contains(e.target) &&
                    e.target !== emojiBtn
                ) {
                    emojiPicker.hidden = true;
                }

                if (
                    !gifPopover.hidden &&
                    !gifPopover.contains(e.target) &&
                    e.target !== gifBtn
                ) {
                    gifPopover.hidden = true;
                }

            }
        );

        /* =========================
           POST ORDER
        ========================= */

        function ordered() {

            if (!shuffled) {
                return posts;
            }

            const arr =
                posts.slice();

            for (
                let i = arr.length - 1;
                i > 0;
                i--
            ) {

                const j =
                    hash(arr[i].id + i) %
                    (i + 1);

                [
                    arr[i],
                    arr[j]
                ] = [
                        arr[j],
                        arr[i]
                    ];

            }

            return arr;
        }

        /* =========================
           RENDER POSTS
        ========================= */

        function render() {

            const list =
                ordered();

            if (!list.length) {

                wallEl.innerHTML =
                    `
            <div class="empty">
              the board's empty. pin the first note.
            </div>
          `;

                return;
            }

            wallEl.innerHTML =
                list.map(p => {

                    const h =
                        hash(p.id);

                    const tab =
                        TABS[h % TABS.length];

                    const rot =
                        ((h % 5) - 2) * 0.6;

                    const name =
                        (p.author || 'anonymous')
                            .replace(/</g, '&lt;');

                    const text =
                        (p.text || '')
                            .replace(/</g, '&lt;');

                    const gifHtml =
                        p.gif
                            ? `
                <img
                  class="noteGif"
                  src="${p.gif.replace(/"/g, '&quot;')}"
                  alt=""
                  loading="lazy"
                  onerror="this.remove()"
                >
              `
                            : '';

                    return `
            <div
              class="note"
              style="transform:rotate(${rot}deg);"
            >

              <div
                class="tab"
                style="background:${tab};"
              ></div>

              ${gifHtml}

              ${text
                            ? `<div class="msg">${text}</div>`
                            : ''
                        }

              <div class="meta">

                <span>
                  ${name}
                </span>

                <span>
                  ${timeAgo(
                            p.ts || Date.now()
                        )}
                </span>

              </div>

            </div>
          `;

                }).join('');
        }

        /* =========================
           LIVE STATUS
        ========================= */

        function setStatus(live) {

            liveMode = live;

            statusPill.classList.toggle(
                'off',
                !live
            );

            statusText.textContent =
                live
                    ? 'live'
                    : 'preview';
        }

        /* =========================
           SHUFFLE
        ========================= */

        shuffleBtn.addEventListener(
            'click',
            () => {

                shuffled = !shuffled;

                shuffleBtn.textContent =
                    shuffled
                        ? 'newest'
                        : 'shuffle';

                render();

            }
        );

        /* =========================
           CHARACTER COUNTER
        ========================= */

        msgInput.addEventListener(
            'input',
            () => {

                const left =
                    220 -
                    msgInput.value.length;

                countEl.textContent =
                    left + ' left';

                countEl.classList.toggle(
                    'warn',
                    left < 20
                );

            }
        );

        /* =========================
           PIN ANIMATION
        ========================= */

        function burst() {

            const rect =
                form.getBoundingClientRect();

            for (
                let i = 0;
                i < 6;
                i++
            ) {

                const s =
                    document.createElement('span');

                s.className =
                    'spk';

                s.textContent =
                    [
                        '✨',
                        '⭐',
                        '●'
                    ][i % 3];

                s.style.left =
                    (
                        40 +
                        Math.random() * 20
                    ) + '%';

                s.style.animationDelay =
                    (i * 30) + 'ms';

                form.appendChild(s);

                setTimeout(
                    () => s.remove(),
                    700
                );

            }
        }

        /* =========================
           SUBMIT POST
        ========================= */

        form.addEventListener(
            'submit',
            async (e) => {

                e.preventDefault();

                const text =
                    msgInput.value.trim();

                if (
                    !text &&
                    !attachedGif
                ) {
                    return;
                }

                errMsg.hidden = true;

                pinBtn.disabled = true;

                const author =
                    nameInput.value.trim();

                const gif =
                    attachedGif;

                try {

                    if (
                        liveMode &&
                        sb
                    ) {

                        const {
                            error
                        } =
                            await sb
                                .from('messages')
                                .insert({
                                    text,
                                    author,
                                    ts: Date.now(),
                                    gif
                                });

                        if (error) {
                            throw error;
                        }

                    } else {

                        posts.unshift({
                            id:
                                'local-' +
                                Date.now() +
                                Math.random()
                                    .toString(36)
                                    .slice(2),

                            text,
                            author,
                            ts: Date.now(),
                            gif
                        });

                        render();

                    }

                    burst();

                    msgInput.value = '';

                    countEl.textContent =
                        '220 left';

                    countEl.classList.remove(
                        'warn'
                    );

                    attachedGif = null;

                    gifChip.hidden = true;

                    gifChipImg.src = '';

                } catch (err) {

                    errMsg.textContent =
                        "couldn't pin that — try again in a moment.";

                    errMsg.hidden = false;

                } finally {

                    pinBtn.disabled = false;

                }
            }
        );

        /* =========================
           INITIALIZE SUPABASE
        ========================= */

        (async function init() {

            if (
                typeof SUPABASE_URL === 'undefined' ||
                typeof SUPABASE_ANON_KEY === 'undefined'
            ) {

                setStatus(false);

                render();

                return;

            }

            try {

                sb =
                    window.supabase.createClient(
                        SUPABASE_URL,
                        SUPABASE_ANON_KEY
                    );

                const {
                    data,
                    error
                } =
                    await sb
                        .from('messages')
                        .select('*')
                        .order(
                            'ts',
                            {
                                ascending: false
                            }
                        )
                        .limit(80);

                if (error) {
                    throw error;
                }

                posts =
                    data || [];

                setStatus(true);

                render();

                sb
                    .channel('messages-live')

                    .on(
                        'postgres_changes',
                        {
                            event: 'INSERT',
                            schema: 'public',
                            table: 'messages'
                        },

                        (payload) => {

                            posts.unshift(
                                payload.new
                            );

                            if (
                                posts.length > 80
                            ) {
                                posts.pop();
                            }

                            render();

                        }
                    )

                    .subscribe();

            } catch (e) {

                setStatus(false);

                render();

            }

        })();

    </script>

</body>
